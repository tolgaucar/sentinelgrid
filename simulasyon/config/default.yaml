# Savaş alanı parametreleri
battlefield:
  # Merkez koordinat (varsayılan: Ankara civarı)
  center_lat: 39.925
  center_lon: 32.837
  radius_km: 50.0
  # Varlık sayıları
  friendly_units: 20
  enemy_units: 15
  drones: 10
  sensors: 30

# Simülasyon parametreleri
simulation:
  tick_interval_ms: 500     # Her simülasyon adımı arası süre
  max_ticks: 200            # Maksimum adım sayısı
  realtime: true            # Gerçek zamanlı mı yoksa hızlandırılmış mı
  log_level: "INFO"
