# ÖTÜKEN-MATRİS Simülasyon Platformu Varsayılan Yapılandırması

platform:
  name: "ÖTÜKEN-MATRİS Simülasyon"
  version: "0.1.0"

# Modül bağlantı bilgileri
modules:
  butun:
    host: "http://127.0.0.1"
    port: 8000
    enabled: true
  bag:
    host: "http://127.0.0.1"
    port: 9091   # BAĞ HTTP status portu
    enabled: true
  kutuk:
    host: "http://127.0.0.1"
    port: 9093   # KÜTÜK HTTP status portu
    enabled: true
  dirlik:
    host: "http://127.0.0.1"
