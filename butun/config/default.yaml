# BÜTÜN - Ana Çatı Sistemi yapılandırması

system:
  name: "ÖTÜKEN-MATRİS"
  module: "BÜTÜN"
  version: "0.1.0"

gateway:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]
  rate_limit:
    requests_per_minute: 1000
    burst: 50

service_mesh:
  heartbeat_interval_sec: 5
  deregister_timeout_sec: 30
  load_balancer:
    strategy: "round_robin"  # round_robin | least_connections | weighted
  circuit_breaker:
    failure_threshold: 5
    recovery_timeout_sec: 30
    half_open_max_calls: 3

orchestrator:
  max_replicas: 10
  min_replicas: 1
  scale_up_threshold_cpu: 80.0
  scale_down_threshold_cpu: 20.0
  health_check_interval_sec: 10

resources:
  cpu_limit_percent: 90.0
  memory_limit_mb: 8192
  disk_limit_mb: 51200

clusters:
  - name: "ULAK"
    description: "Altyapı ve Veri İletişimi"
    phase: 1
    modules:
      - "BÜTÜN"
      - "BAĞ"
      - "KÜTÜK"
      - "DİRLİK"
      - "BAĞDAŞ"
      - "AKIM"
      - "YURT"
      - "YÜZEY"
      - "İM"
      - "YAYIN"
      - "DURAK"
      - "TUTUM"

  - name: "GÖRGÜ"
    description: "Algılama ve İstihbarat"
    phase: 2
    modules:
      - "TANI"
      - "KÖZ"
      - "SEZİ"
      - "YANKI"
      - "DUYUM"
      - "BAŞKALA"
      - "SÖZGEÇ"
      - "İZLEK"
      - "KATMAN"
      - "AYDIN"
      - "GÖLGE"
      - "UFKUN"

  - name: "BUYRUK"
    description: "Beyin ve Biliş - Karar Motorları"
    phase: 3
    modules:
      - "TÖRE"
      - "TAYIN"
      - "ÖNGÖRÜ"
      - "VİCDAN"
      - "DİLMAÇ"
      - "BİLGE"
      - "YARGI"
      - "DÜZEN"
      - "AKIL"
      - "SORGUN"
      - "YAZIT"
      - "KESİN"

  - name: "KOVAN"
    description: "Kas ve Uzuvlar - Otonom Platformlar"
    phase: 4
    modules:
      - "SAĞANAK"
      - "YERLEM"
      - "ONAR"
      - "EVRİM"
      - "SAPMA"
      - "KOŞUT"
      - "DENGEL"
      - "BİÇİM"
      - "SADAK"
      - "ÇEVİK"
      - "YÖNEL"
      - "ÖNCÜ"

  - name: "KIN"
    description: "Bağışıklık Sistemi - Siber Savunma"
    phase: 5
    modules:
      - "AYIK"
      - "ÖZEK"
      - "EŞİK"
      - "SAĞLAM"
      - "MÜHÜR"
      - "SIR"
      - "YALVAÇ"
      - "KIRIM"
      - "KORAY"
      - "ÖRTÜ"
      - "GEÇİT"
      - "SİBİ"
