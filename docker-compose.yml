      - BAGDAS_HTTP_PORT=9097
      - BAGDAS_BUTUN_URL=http://butun:8000
      - BAGDAS_BAG_URL=http://bag:9091
    depends_on:
      butun:
        condition: service_healthy
      bag:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9097/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
