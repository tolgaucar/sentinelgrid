# ÖTÜKEN-MATRİS — Docker Compose
# Tüm Faz 1 (ULAK kümesi) modüllerini başlatır
#
# Kullanım:
#   docker compose up -d          — Tüm modülleri başlat
#   docker compose logs -f yuzey  — YÜZEY loglarını izle
#   docker compose down           — Tüm modülleri durdur

services:
  butun:
    build:
      context: .
      dockerfile: butun/Dockerfile
    container_name: otuken-butun
    ports:
      - "8000:8000"
    environment:
      - OTUKEN_ENV=prod
      - BUTUN_PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - otuken

  bag:
    build:
      context: .
      dockerfile: bag/Dockerfile
    container_name: otuken-bag
    ports:
      - "9090:9090"
      - "9091:9091"
    environment:
      - OTUKEN_ENV=prod
      - BAG_GRPC_PORT=9090
      - BAG_HTTP_PORT=9091
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9091/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - otuken

  kutuk:
    build:
      context: .
      dockerfile: kutuk/Dockerfile
    container_name: otuken-kutuk
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - OTUKEN_ENV=prod
      - KUTUK_GRPC_PORT=9092
      - KUTUK_HTTP_PORT=9093
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - otuken

  dirlik:
    build:
      context: .
      dockerfile: dirlik/Dockerfile
    container_name: otuken-dirlik
    ports:
      - "9094:9094"
      - "9095:9095"
    environment:
      - OTUKEN_ENV=prod
      - DIRLIK_HTTP_PORT=9095
      - DIRLIK_GRPC_PORT=9094
      - DIRLIK_BUTUN_URL=http://butun:8000
      - DIRLIK_BAG_URL=http://bag:9091
    depends_on:
      butun:
        condition: service_healthy
      bag:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - otuken

  bagdas:
    build:
      context: .
      dockerfile: bagdas/Dockerfile
    container_name: otuken-bagdas
